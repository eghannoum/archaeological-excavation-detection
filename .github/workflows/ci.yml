name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black==26.5.1 ruff==0.16.1 isort==8.0.1 mypy==2.3.0 pre-commit==4.6.1 pytest==9.1.1 pytest-cov==7.1.0

      - name: Ruff
        run: ruff check scripts tests

      - name: Black (format check)
        run: black --check scripts tests

      - name: Mypy (static type check)
        run: mypy scripts tests

  test:
    name: Test (pytest, CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU-portable torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -m "not slow"
