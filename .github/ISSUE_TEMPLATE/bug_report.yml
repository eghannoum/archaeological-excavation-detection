name: Bug report
description: Report a bug or unexpected behavior in the pipeline
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please provide
        as much context as possible so we can reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal commands or code that trigger the bug.
      placeholder: |
        1. Run `python scripts/train.py experiment=yolo26n`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        OS, Python version, GPU/CPU, and installed package versions.
        Paste the output of `python -m pip freeze` if possible.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant error messages or tracebacks.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help, e.g. screenshots or links.
