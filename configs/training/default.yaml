# Training hyperparameters

# -- Optimizer --
optimizer: AdamW
lr: 0.001
weight_decay: 0.0005
momentum: 0.937             # used by SGD

# -- Batch & epochs --
batch_size: 16              # default; overridden per experiment
epochs: 100
workers: 4                  # DataLoader workers

# -- Regularisation --
gradient_clip: 10.0         # max grad norm; 0 = disabled
label_smoothing: 0.0
dropout: 0.0

# -- LR scheduler --
scheduler:
  name: cosine               # cosine | step | linear | constant
  warmup_epochs: 3
  warmup_lr: 0.0001
  lr_min_ratio: 0.01         # fraction of initial lr for cosine min
  step_size: 30              # only for step scheduler
  gamma: 0.1                 # only for step scheduler

# -- Early stopping --
early_stopping:
  enabled: true
  patience: 20
  metric: val/mAP50
  min_delta: 0.001

# -- Precision & device --
precision: fp16              # fp16 | fp32 | bf16
device: auto                 # auto | cuda:0 | cpu
deterministic: false

# -- Resume --
resume: false
checkpoint_path: null

# -- Reproducibility --
seed: 42
