# Training hyperparameters

# -- Optimizer --
optimizer: AdamW
lr: 0.001
weight_decay: 0.0005
momentum: 0.937             # used by SGD

# -- Batch & epochs --
batch_size: 16              # default; overridden per experiment
epochs: 100
workers: 4                  # DataLoader workers

# -- LR scheduler --
scheduler:
  name: cosine               # cosine | step | linear | constant
  warmup_epochs: 3

# -- Early stopping --
early_stopping:
  enabled: true
  patience: 20
  metric: val/mAP50
  min_delta: 0.001

# -- Precision & device --
precision: fp16              # fp16 | fp32 | bf16
device: auto                 # auto | cuda:0 | cpu

# -- Reproducibility --
seed: 42
