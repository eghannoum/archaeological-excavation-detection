# Light augmentation mode.
# Mode settings only - the actual Albumentations transform
# lists are defined in Python in scripts/augmentation.py.
# The ultralytics block configures native YOLO augmentations.

enabled: true
mode: light

ultralytics:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 10