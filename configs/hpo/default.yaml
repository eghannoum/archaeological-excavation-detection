# Hyperparameter optimisation (Optuna) configuration

enabled: false                # set true to run HPO instead of single train
n_trials: 50
direction: maximize           # maximize | minimize
target_metric: val/mAP50

sampler:
  name: TPE                   # Tree-structured Parzen Estimator
  seed: 42
  n_startup_trials: 5         # random exploration before TPE takes over
  n_ei_candidates: 24

pruner:
  name: Median                # MedianPruner
  n_startup_trials: 5
  n_warmup_steps: 10
  interval_steps: 1

study_name: yolo26m-hpo
storage: null                  # null = in-memory; or sqlite:///path
load_if_exists: false

trial_epochs: 15                  # reduced from 30 per full training — speeds up HPO

# Search space defined in Python code (scripts/hpo.py SEARCH_SPACE).
# Batch size is FIXED at 8 per GPU benchmark — NOT searched.
# Reference: 12 hyper-parameters
#   lr:            log-uniform [1e-4, 1e-2]
#   momentum:      uniform     [0.8, 0.95]
#   weight_decay:  log-uniform [1e-5, 1e-3]
#   optimizer:     categorical ['AdamW', 'SGD']
#   warmup_epochs: int         [0, 5]
#   cos_lr:        categorical [True, False]
#   hsv_h:         uniform     [0.0, 0.1]
#   hsv_s:         uniform     [0.0, 0.9]
#   hsv_v:         uniform     [0.0, 0.9]
#   degrees:       uniform     [0.0, 45.0]
#   mosaic:        categorical [0.0, 0.5, 1.0]
#   mixup:         categorical [0.0, 0.5, 1.0]
