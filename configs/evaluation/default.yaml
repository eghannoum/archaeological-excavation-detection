# Evaluation / inference configuration

# -- Thresholds --
conf_threshold: 0.25         # confidence score threshold
iou_threshold: 0.5           # NMS IoU threshold
max_detections: 300          # max detections per image

# -- Metrics --
metrics:
  - mAP50
  - mAP50-95
  - precision
  - recall
  - F1

per_class: true
save_plots: true
save_predictions: true

# -- Test-time augmentation --
tta: false
tta_horizontal_flip: true
tta_multi_scale: false
