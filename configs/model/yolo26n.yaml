# @package _global_
# YOLO26 nano model config
# Scaled from best HPO params (trial #49, mAP50=0.3803)
# Scaling: LR x1.5, WD x0.5 (less regularization), batch_size 32

name: yolo26n
variant: nano
task: detect
pretrained: true
weights: ${hydra:runtime.cwd}/models/${model.name}.pt
backbone: null
num_classes: ${data.num_classes}
img_size: ${data.image_size}

# HPU-scaled hyperparameters (override training defaults)
training:
  lr: 0.0007051875516177442          # best_lr x 1.5
  momentum: 0.8513822497686899        # same as best
  weight_decay: 0.0003929932090845043 # best_wd x 0.5 (less regularization for smaller model)
  optimizer: AdamW
  batch_size: 32                      # nano can fit larger batches
  scheduler:
    warmup_epochs: 3                  # fewer warmup epochs for faster convergence at small scale
    name: linear                      # linear scheduler (matching best cos_lr=false)

augmentation:
  ultralytics:
    hsv_h: 0.06797850615120683        # same as best
    hsv_s: 0.29848516550771803        # same as best
    hsv_v: 0.43259482322061726        # same as best
    degrees: 14.589208751789348       # same as best
    mosaic: 0.5                       # same as best
    mixup: 0.5                        # reduced from 1.0 (nano benefits less from strong mixing)
