# @package _global_
# YOLO26 large model config
# Scaled from best HPO params (trial #49, mAP50=0.3803)
# Scaling: LR x0.8, WD x1.5 (more regularization), batch_size 8

name: yolo26l
variant: large
task: detect
pretrained: true
weights: ${hydra:runtime.cwd}/models/${model.name}.pt
backbone: null
num_classes: ${data.num_classes}
img_size: ${data.image_size}

# HPU-scaled hyperparameters (override training defaults)
training:
  lr: 0.0003761000275294636          # best_lr x 0.8 (lower LR for larger model stability)
  momentum: 0.8513822497686899        # same as best
  weight_decay: 0.0011789796272475128 # best_wd x 1.5 (more regularization for larger model)
  optimizer: AdamW
  batch_size: 8                       # reduced for larger model memory footprint
  scheduler:
    warmup_epochs: 5                  # same as best
    name: linear                      # linear scheduler (matching best cos_lr=false)

augmentation:
  ultralytics:
    hsv_h: 0.06797850615120683        # same as best
    hsv_s: 0.29848516550771803        # same as best
    hsv_v: 0.43259482322061726        # same as best
    degrees: 14.589208751789348       # same as best
    mosaic: 0.5                       # same as best
    mixup: 1.0                        # same as best
