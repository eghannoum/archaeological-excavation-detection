# @package _global_
# Faster R-CNN ResNet-50 FPN (torchvision) model config
# Two-stage detector baseline — torchvision pretrained on COCO
# Training uses custom script: scripts/train_faster_rcnn.py

experiment:
  name: faster_rcnn
  description: "Faster R-CNN ResNet-50 FPN — two-stage detector baseline (torchvision)"

model:
  name: faster_rcnn
  variant: resnet50_fpn
  arch: fasterrcnn_resnet50_fpn
  pretrained: true
  weights: null                # torchvision loads pretrained weights internally
  num_classes: 1              # single class (hole) — replaces COCO 91-class head

training:
  batch_size: 4               # heavier than YOLO — 8GB VRAM limit
  optimizer: SGD
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  epochs: 100
  workers: 2                  # reduced for memory safety
  scheduler:
    name: step
    step_size: 30
    gamma: 0.1
  early_stopping:
    enabled: true
    patience: 20
  precision: fp32             # Faster R-CNN less stable with AMP
