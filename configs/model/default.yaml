# Model configuration
# Each experiment config overrides name and variant (e.g. experiment=yolo26m)

name: yolo26n                # default; overridden via experiment=<name>
variant: nano                # default; overridden via experiment=<name>
task: detect
pretrained: true
weights: ${hydra:runtime.cwd}/models/${model.name}.pt
backbone: null             # override for non-YOLO models (e.g., resnet50)
num_classes: ${data.num_classes}
img_size: ${data.image_size}
