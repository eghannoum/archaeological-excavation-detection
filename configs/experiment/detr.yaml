# @package _global_
# NOTE: Reference-only documentation for scripts/train_detr.py (argparse-based
# trainer). Not consumed by scripts/train.py — DETR runs via the standalone script.
# ── DETR (Facebook Research) ──────────────────────────────
# Batch size: 4 (fits 8 GB VRAM on RTX 5070 Laptop)
# NOTE: Downloads model at runtime via:
#   torch.hub.load('facebookresearch/detr', 'detr_resnet50', pretrained=True)
# Weights are NOT stored in models/ — they come from torch.hub cache.
# DETR requires special training loop (Hungarian matching, no NMS).

experiment:
  name: detr
  description: "DETR ResNet-50 — end-to-end transformer detector"

model:
  name: detr
  variant: resnet50
  arch: detr_resnet50
  weights: null                # torch.hub loads pretrained at runtime

training:
  batch_size: 4
  optimizer: AdamW
  lr: 0.0001                   # lower LR typical for DETR
  weight_decay: 0.0001
  gradient_clip: 0.1           # DETR uses smaller clip
  scheduler:
    name: step
    step_size: 40
    gamma: 0.1
