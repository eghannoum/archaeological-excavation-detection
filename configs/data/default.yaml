# Dataset configuration
# The dataset/ directory is generated by the data preparation pipeline:
#   dataset/{train,val,test}/images, dataset/{train,val,test}/labels

dataset_name: archaeological_holes
dataset_path: ${hydra:runtime.cwd}/dataset
train_split: train
val_split: val
test_split: test
num_classes: 1            # single class: hole
class_names:
  - hole
format: yolo               # YOLO annotation format (class x_center y_center width height)
annotation_suffix: .txt
image_size: 640            # px; training / inference resolution
