[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archaeological-hole-detection"
version = "0.1.0"
description = "Detection of unauthorized archaeological excavation holes from satellite imagery (YOLO26, YOLOv8, YOLO11, Faster R-CNN, DETR)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "STI Unauthorized Archaeological Excavations contributors" }]
keywords = ["object-detection", "yolo", "satellite-imagery", "archaeology", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.4,<2.12",
    "torchvision>=0.19,<0.27",
    "ultralytics==8.4.72",
    "albumentations>=1.4,<3.0",
    "mlflow>=3.14,<4.0",
    "optuna>=4.9,<5.0",
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3,<3.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.13,<2.0",
    "Pillow>=10.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
dashboard = ["gradio>=4.44,<6.0"]

[tool.setuptools]
packages = ["scripts", "tests"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length enforced by black

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
